name: CI

on:
  push:
    branches:
      - test
      - main
  pull_request:
    branches:
      - test

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (npm ci with legacy peer deps)
        run: npm ci --legacy-peer-deps

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test --show-stack-traces

      - name: Upload test results (Junit) (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: ./test-output || ./mochahub || ''
